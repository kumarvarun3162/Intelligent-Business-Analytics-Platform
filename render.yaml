# render.yaml — in project root (ibap/)

services:
  - type: web
    name: ibap
    runtime: python
    rootDir: backend
    buildCommand: |
      apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf2.0-0 libcairo2 libffi-dev || true
      pip install -r requirements.txt
      cd ../frontend && npm install && npm run build
      mkdir -p ../backend/static
      cp -r ../frontend/dist/. ../backend/static/
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DEBUG
        value: "false"
      - key: RENDER_DISK_PATH
        value: /data
      - key: ALLOWED_ORIGINS
        value: https://intelligent-business-analytics-platform.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
    disk:
      name: ibap-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /health